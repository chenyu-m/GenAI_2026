<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic LLM Final - Full Fallback & Mock</title>
    <style>
        /* 🎨 淺藍色主題設定 */
        :root { 
            --primary-color: #97CBFF;   
            --sidebar-bg: #F4F9FF;      
            --sidebar-border: #D0E5FA;  
            --sidebar-text: #333333;    
        }
        
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; background-color: #f0f2f5; }

        /* 左側側邊欄 */
        #sidebar { width: 260px; background-color: var(--sidebar-bg); color: var(--sidebar-text); border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; transition: width 0.3s ease, padding 0.3s ease; overflow: hidden; white-space: nowrap; }
        #sidebar.collapsed { width: 0; padding: 0; border: none; }
        
        #sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid var(--sidebar-border); font-weight: bold; color: var(--primary-color); font-size: 1.1rem; }
        #new-chat-btn { background: white; color: var(--primary-color); border: 2px solid var(--primary-color); padding: 10px; margin: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #new-chat-btn:hover { background: var(--primary-color); color: white; }
        
        #session-list { flex: 1; overflow-y: auto; padding: 0 10px; }
        .session-item { padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; transition: 0.2s; color: #555; }
        .session-item:hover { background: #E3EFFF; }
        .session-item.active { background: var(--primary-color); color: white; font-weight: bold; }
        .session-title { overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        
        .session-actions { display: flex; gap: 8px; }
        .icon-btn { font-size: 14px; opacity: 0.7; cursor: pointer; }
        .icon-btn:hover { opacity: 1; transform: scale(1.1); }

        /* 右側主對話區 */
        #main-content { flex: 1; display: flex; flex-direction: column; background: white; min-width: 0; }
        
        #chat-header { background-color: var(--primary-color); color: white; padding: 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        #toggle-sidebar-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: white; padding: 0 5px; }
        #toggle-sidebar-btn:hover { opacity: 0.8; }

        /* 模型選擇器樣式 */
        .model-selector { padding: 6px 12px; border-radius: 20px; border: 1px solid white; background: rgba(255, 255, 255, 0.2); color: white; font-size: 0.9rem; font-weight: bold; outline: none; cursor: pointer; transition: 0.3s; }
        .model-selector:hover { background: rgba(255, 255, 255, 0.4); }
        .model-selector option { color: #333; font-weight: normal; }

        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { width: fit-content; max-width: 75%; padding: 12px 18px; border-radius: 15px; word-wrap: break-word; line-height: 1.5; font-size: 1rem; }
        .user-msg { background-color: var(--primary-color); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai-msg { background-color: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; white-space: pre-wrap; }
        .sys-msg { background-color: #ffeaa7; color: #d35400; align-self: center; font-size: 0.85rem; padding: 6px 16px; border-radius: 20px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* 輸入區 */
        #input-area { padding: 20px; background: white; border-top: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
        #user-input { flex: 1; padding: 12px 20px; border: 1px solid #ccc; border-radius: 25px; outline: none; font-size: 1rem; transition: 0.3s; }
        #user-input:focus { border-color: var(--primary-color); box-shadow: 0 0 5px rgba(151, 203, 255, 0.4); }
        #send-btn, .action-btn { padding: 10px 20px; background-color: var(--primary-color); color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        #send-btn:hover, .action-btn:hover { opacity: 0.9; }
        #send-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        #preview-container { display: none; position: relative; }
        #preview-img { max-height: 40px; border-radius: 5px; border: 1px solid #ccc; }
        #remove-img { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 15px; height: 15px; font-size: 10px; text-align: center; cursor: pointer; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">YuYu LLM</div>
        <button id="new-chat-btn" onclick="createNewSession()">+ 新增對話</button>
        <div id="session-list"></div>
    </div>

    <div id="main-content">
        <div id="chat-header">
            <div class="header-left">
                <button id="toggle-sidebar-btn" onclick="toggleSidebar()" title="收合/展開側邊欄">☰</button>
                <span id="current-chat-title" style="font-weight: bold; font-size: 1.1rem;">新對話</span>
            </div>
            <select id="model-select" class="model-selector">
                <option value="auto">Auto</option>
                <option value="gemini-2.5-pro">2.5 Pro</option>
                <option value="gemini-2.5-flash">2.5 Flash</option>
                <option value="gemini-2.0-flash">2.0 Flash</option>
                <option value="mock" style="background: #ffeaa7; color: #d35400;">模擬模式</option>
            </select>
        </div>
        
        <div id="messages"></div>
        
        <div id="input-area">
            <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            <button class="action-btn" onclick="document.getElementById('file-input').click()" title="上傳圖片">📷</button>
            <div id="preview-container">
                <img id="preview-img" src="" alt="preview">
                <div id="remove-img" onclick="removeImage()">x</div>
            </div>
            <input type="text" id="user-input" placeholder="輸入訊息..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">送出</button>
        </div>
    </div>

    <script>
        const API_KEY = ''; // ⚠️ 請填入你的 API KEY

        // --- 資料結構 ---
        let base64Image = null;
        let userProfile = JSON.parse(localStorage.getItem('hw2_final_profile')) || { preferences: [] };
        let chatSessions = JSON.parse(localStorage.getItem('hw2_final_sessions')) || {};
        let currentSessionId = localStorage.getItem('hw2_final_current_id') || "";

        window.onload = () => {
            if (Object.keys(chatSessions).length === 0) createNewSession();
            else {
                renderSessionList();
                if (chatSessions[currentSessionId]) loadSession(currentSessionId);
                else loadSession(Object.keys(chatSessions)[0]);
            }
        };

        // --- UI 控制 ---
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

        // --- 會話管理 (CRUD) ---
        function createNewSession() {
            const id = "session_" + Date.now();
            chatSessions[id] = { name: "新對話 " + (Object.keys(chatSessions).length + 1), history: [] };
            saveData(); renderSessionList(); loadSession(id);
        }

        function loadSession(id) {
            currentSessionId = id; localStorage.setItem('hw2_final_current_id', id);
            document.getElementById('current-chat-title').innerText = chatSessions[id].name;
            document.getElementById('messages').innerHTML = "";
            
            if (chatSessions[id].history.length === 0) {
                appendMessage("你好！你可以選擇 Auto 讓系統自動尋找可用模型。如果完全沒額度了，請選擇「模擬模式」進行測試。", 'ai-msg');
            } else {
                chatSessions[id].history.forEach(msg => {
                    if (msg.role === 'user' || msg.role === 'model') {
                        const text = msg.parts.find(p => p.text)?.text || "[非文字內容]";
                        if(text) appendMessage(text, msg.role === 'user' ? 'user-msg' : 'ai-msg');
                    }
                });
            }
            renderSessionList();
        }

        function renameSession(id, event) {
            event.stopPropagation();
            const newName = prompt("請輸入對話名稱:", chatSessions[id].name);
            if (newName && newName.trim() !== "") {
                chatSessions[id].name = newName.trim(); saveData(); renderSessionList();
                if (id === currentSessionId) document.getElementById('current-chat-title').innerText = newName;
            }
        }

        function deleteSession(id, event) {
            event.stopPropagation();
            if (!confirm(`確定要刪除「${chatSessions[id].name}」嗎？`)) return;
            delete chatSessions[id]; 
            const remainingIds = Object.keys(chatSessions);
            if (remainingIds.length === 0) createNewSession(); 
            else if (id === currentSessionId) loadSession(remainingIds[remainingIds.length - 1]); 
            else { saveData(); renderSessionList(); }
        }

        function renderSessionList() {
            const list = document.getElementById('session-list'); list.innerHTML = "";
            Object.keys(chatSessions).reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = `session-item ${id === currentSessionId ? 'active' : ''}`;
                item.onclick = () => loadSession(id);
                item.innerHTML = `<span class="session-title">${chatSessions[id].name}</span><div class="session-actions"><span class="icon-btn" onclick="renameSession('${id}', event)" title="重新命名">✎</span><span class="icon-btn" onclick="deleteSession('${id}', event)" title="刪除">🗑️</span></div>`;
                list.appendChild(item);
            });
        }

        function saveData() {
            localStorage.setItem('hw2_final_sessions', JSON.stringify(chatSessions));
            localStorage.setItem('hw2_final_profile', JSON.stringify(userProfile));
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
        function handleImageUpload(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                base64Image = event.target.result.split(',')[1];
                document.getElementById('preview-img').src = event.target.result;
                document.getElementById('preview-container').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
        function removeImage() { base64Image = null; document.getElementById('preview-container').style.display = 'none'; }

        // --- 🔥 核心：支援全家族的無敵瀑布流 + 模擬模式 ---
        async function fetchWithWaterfallRouting(isComplex, requestBody) {
            const selectedMode = document.getElementById('model-select').value;
            
            // 🌟 1. 如果選擇模擬模式，直接不打 API，回傳假資料
            if (selectedMode === 'mock') {
                await new Promise(resolve => setTimeout(resolve, 800)); // 假裝思考 0.8 秒
                const userInput = requestBody.contents[requestBody.contents.length - 1].parts.map(p => p.text).join("");
                
                // 假裝處理工具或特定字眼
                if (userInput.includes("幾點") || userInput.includes("時間")) {
                    return { 
                        text: "", usedModel: "mock-model",
                        raw_data: { candidates: [{ content: { parts: [{ functionCall: { name: "get_current_time" } }] } }] }
                    };
                }
                
                return { 
                    text: "這是一段系統自動生成的模擬回覆。因為 API 額度用盡，系統目前運行在『Mock 模式』。這證明了您的 UI、歷史紀錄與防呆機制皆運作正常！", 
                    usedModel: "Mock(模擬)" 
                };
            }

            // 🌟 2. 真實 API 路由名單 (加入 1.5 家族)
            let modelChain = [];
            if (selectedMode === 'auto') {
                modelChain = [
                    "gemini-2.5-pro", "gemini-2.5-flash", "gemini-2.0-flash", 
                    "gemini-1.5-pro", "gemini-1.5-flash", "gemini-1.5-flash-8b", "mock"
                ];
            } else {
                modelChain = [selectedMode];
            }

            let lastError = "";
            for (let i = 0; i < modelChain.length; i++) {
                const modelName = modelChain[i];
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody)
                    });
                    const data = await response.json();

                    if (response.ok && data.candidates && data.candidates.length > 0) {
                        return { text: data.candidates[0].content.parts[0].text || "", usedModel: modelName, raw_data: data };
                    }

                    if (!response.ok && (data.error?.message.includes("Quota") || response.status === 429)) {
                        console.warn(`[自動路由] ${modelName} 額度已滿，切換下一個...`);
                        if (i < modelChain.length - 1) appendMessage(`⚠️ 系統提示：${modelName} 額度不足，自動切換至備用模型...`, 'sys-msg');
                        lastError = data.error?.message;
                        continue; 
                    }
                    throw new Error(data.error?.message || "未知的 API 錯誤");
                } catch (error) {
                    lastError = error.message;
                }
            }
            throw new Error(`所有模型皆無法提供服務。最後錯誤: ${lastError}。建議右上角切換至「🎭 模擬模式」進行測試。`);
        }

        // --- 發送訊息主邏輯 ---
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const messageText = inputField.value.trim();
            const sendBtn = document.getElementById('send-btn');
            
            if (!messageText && !base64Image) return;

            appendMessage(messageText || "[傳送圖片]", 'user-msg');
            inputField.value = ''; sendBtn.disabled = true;

            let currentParts = [];
            if (messageText) currentParts.push({ text: messageText });
            if (base64Image) {
                currentParts.push({ inline_data: { mime_type: "image/jpeg", data: base64Image } });
                removeImage();
            }

            chatSessions[currentSessionId].history.push({ role: "user", parts: currentParts });

            const isComplex = base64Image || messageText.length > 50;
            const sysPrompt = `你是一個具備長期記憶的助手。
            這是你對這位使用者的長期了解：${JSON.stringify(userProfile.preferences)}。
            如果對話中出現新的個人資訊，請在回覆最後加上 [SAVE_MEMORY: 資訊內容]。`;

            try {
                const requestBody = {
                    systemInstruction: { parts: [{ text: sysPrompt }] },
                    contents: chatSessions[currentSessionId].history.slice(-15),
                    tools: [{ function_declarations: [{ name: "get_current_time", description: "取得當前台灣時間" }] }]
                };

                const result = await fetchWithWaterfallRouting(isComplex, requestBody);
                let aiResponseText = "";
                let usedModel = result.usedModel;

                // --- 🛠️ Tool Use (MCP) 處理邏輯 ---
                if (result.raw_data && result.raw_data.candidates && result.raw_data.candidates[0].content.parts[0].functionCall) {
                    const funcCall = result.raw_data.candidates[0].content.parts[0].functionCall;
                    
                    if (funcCall.name === "get_current_time") {
                        appendMessage(`🛠️ [系統] 執行外部工具：${funcCall.name}...`, 'sys-msg');
                        const currentTime = new Date().toLocaleString('zh-TW');
                        
                        chatSessions[currentSessionId].history.push({ role: "model", parts: [{ functionCall: funcCall }] });
                        chatSessions[currentSessionId].history.push({ 
                            role: "function", 
                            parts: [{ functionResponse: { name: "get_current_time", response: { time: currentTime } } }] 
                        });

                        // 判斷是否為 Mock 模式
                        if (usedModel === "mock-model") {
                            await new Promise(resolve => setTimeout(resolve, 500));
                            aiResponseText = `系統模擬回覆：現在的台灣時間是 ${currentTime}。`;
                            usedModel = "Mock(模擬)";
                        } else {
                            const toolRequestBody = {
                                systemInstruction: { parts: [{ text: sysPrompt }] },
                                contents: chatSessions[currentSessionId].history.slice(-15),
                                tools: [{ function_declarations: [{ name: "get_current_time", description: "取得當前台灣時間" }] }]
                            };
                            const finalResult = await fetchWithWaterfallRouting(isComplex, toolRequestBody);
                            aiResponseText = finalResult.text;
                            usedModel = finalResult.usedModel;
                        }
                    }
                } else {
                    aiResponseText = result.text;
                }

                // 處理隱藏記憶提取
                if (aiResponseText.includes("[SAVE_MEMORY:")) {
                    const match = aiResponseText.match(/\[SAVE_MEMORY:\s*(.*?)\]/);
                    if (match) {
                        userProfile.preferences.push(match[1]);
                        saveData();
                    }
                    aiResponseText = aiResponseText.replace(/\[SAVE_MEMORY:.*?\]/g, "").trim();
                }

                appendMessage(`[由 ${usedModel} 處理]\n${aiResponseText}`, 'ai-msg');
                chatSessions[currentSessionId].history.push({ role: "model", parts: [{ text: aiResponseText }] });
                saveData();

            } catch (error) {
                appendMessage("系統錯誤: " + error.message, 'sys-msg');
                chatSessions[currentSessionId].history.pop();
            } finally {
                sendBtn.disabled = false;
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
    </script>
</body>
</html>
