<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my LLM</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #chat-container {
            width: 100%;
            max-width: 450px;
            height: 80vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #chat-header {
            background-color: #1a73e8;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }
        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-msg {
            background-color: #1a73e8;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai-msg {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        #input-area {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 1rem;
        }
        #user-input:focus {
            border-color: #1a73e8;
        }
        #send-btn {
            margin-left: 10px;
            padding: 10px 20px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        #send-btn:hover {
            background-color: #1557b0;
        }
        #send-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="chat-header">我的專屬 AI 助手</div>
        
        <div id="messages">
            <div class="message ai-msg">你好！我是你的 AI 助手，請問今天想聊些什麼呢？</div>
        </div>
        
        <div id="input-area">
            <input type="text" id="user-input" placeholder="輸入你的問題..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">送出</button>
        </div>
    </div>

    <script>
        // ⚠️ API_KEY
        const API_KEY = ''; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;
        
        // 監聽鍵盤事件
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // 發送訊息的主要函數
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const messageText = inputField.value.trim();
            const sendBtn = document.getElementById('send-btn');

            if (messageText === '') return; // 如果沒打字就不動作

            // 1. 把使用者的訊息加到畫面上
            appendMessage(messageText, 'user-msg');
            inputField.value = ''; // 清空輸入框
            
            // 讓按鈕暫時不能按，並顯示載入中
            sendBtn.disabled = true;
            sendBtn.innerText = '思考中...';

            try {
                // 2. 準備要傳給 Gemini 的資料格式
                const requestBody = {
                    contents: [{
                        parts: [{ text: messageText }]
                    }]
                };

                // 3. 呼叫 API (Fetch)
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`API 請求失敗: ${response.status}`);
                }

                const data = await response.json();
                
                // 4. 解析 Gemini 的回覆並顯示在畫面上
                const aiResponseText = data.candidates[0].content.parts[0].text;
                appendMessage(aiResponseText, 'ai-msg');

            } catch (error) {
                console.error("錯誤:", error);
                appendMessage("發生了一點錯誤，請檢查你的 API Key 是否正確，或是稍後再試。", 'ai-msg');
            } finally {
                // 恢復送出按鈕
                sendBtn.disabled = false;
                sendBtn.innerText = '送出';
            }
        }

        // 把訊息文字加上 HTML 標籤後塞進對話框的輔助函數
        function appendMessage(text, className) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            messagesDiv.appendChild(messageDiv);
            
            // 讓對話框永遠自動捲動到最下面
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
